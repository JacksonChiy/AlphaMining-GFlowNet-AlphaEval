[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-mining-gflownet-alphaeval"
version = "0.6.0"
description = "基于 GFlowNet、AlphaEval 和 LightGBM 的日频与分钟频因子挖掘框架"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6.0,<7",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
training = [
  "torch>=2.2",
  "lightgbm>=4.3,<5",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]
ddb = ["dolphindb"]
dev = ["pytest>=8,<10", "jupyter>=1,<2"]

[tool.setuptools.packages.find]
include = ["src*", "rqalpha_strategy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
