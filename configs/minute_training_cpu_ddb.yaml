dataset:
  source: dolphindb
  mining_start_date: '2020-01-01'
  mining_end_date: '2023-12-31'
  out_of_sample_start_date: '2024-01-01'
  out_of_sample_end_date: '2026-12-31'

  dolphindb:
    # 连接信息只从环境变量读取，禁止把账号密码写入仓库。
    host_env: DDB_HOST
    port_env: DDB_PORT
    user_env: DDB_USER
    password_env: DDB_PASSWORD
    database_env: DDB_DATABASE
    table_env: DDB_TABLE
    keep_alive_seconds: 60
    reconnect_attempts: 3

    # TradeDays位于独立DFS数据库，库路径从环境变量读取，不写入仓库。
    trade_days_database_env: DDB_TRADE_DAYS_DATABASE
    trade_days_table: TradeDays
    # 日期列未配置时，只在Schema中恰好存在一个DATE列时自动识别；
    # 若有多个DATE列，请显式填写列名。
    # trade_days_date_column: tradeDate

    # 两机部署：DDB只用于一次性构建；训练从训练服务器本地MemMap读取。
    load_mode: memmap
    start_date: '2020-01-01'
    end_date: '2026-12-31'
    # 审计和日频标签聚合只返回小结果，可用大日期块减少远程往返。
    audit_chunk_days: 120
    daily_aggregate_chunk_days: 120
    # Reward读取原始分钟行，保持1天以限制Windows内存。
    chunk_days: 1
    cache_dir: data/minute_ddb_cache
    force_refresh: false

    # 支持的分钟表达式在DDB服务端Reduce为日频后再传输；不支持的复杂趋势算子
    # 使用NumPy回退。关闭fallback可在任何下推失败时立即停止，便于严格验收。
    pushdown_enabled: true
    pushdown_fallback: true

    # 当前表没有复权因子。确认OHLC已复权后必须改成true，否则程序会停止。
    prices_are_adjusted: false

  memmap:
    # MemMap必须位于训练服务器本地SSD/NVMe，不要放DDB服务器或网络共享盘。
    root_env: ALPHAMINING_MEMMAP_DIR
    block_cache_env: ALPHAMINING_BLOCK_CACHE_DIR
    expected_minutes: 241
    # 固定241根：09:25集合竞价1根 + 上午120根 + 下午120根。
    minute_sessions:
      - ['09:31:00', '11:30:00']
      - ['13:01:00', '15:00:00']
    minute_extra_times:
      - '09:25:00'
    quality_audit_dir: results/minute_cpu_ddb/data_quality
    quality_audit_chunk_days: 20
    quality_audit_scope: grid
    stock_tile_size: 256
    # MemMap构建并发：每个线程创建独立DDB连接，并写入不同交易日切片。
    build_workers: 4
    # 训练阶段按year x stock_tile并行读取MemMap，与build_workers相互独立。
    workers: 4
    # Reward直接在(day, minute, stock)数组上运行；不构造分钟Pandas长表。
    reward_backend: numpy
    # 每个任务最多处理20个交易日。越小进度越细、峰值内存越低，但任务调度更多。
    reward_chunk_days: 20
    # 若未来Grammar加入尚未迁移的算子，自动回退旧Pandas实现；当前92个动作均已支持。
    numpy_fallback: true
    # 每批至少处理该数量的交易日后统一flush；实际批次不会小于build_workers。
    flush_every_days: 8
    force_rebuild: false

cpu_runtime:
  torch_threads: 8
  interop_threads: 2
  blas_threads: 1

model:
  name: MinuteGFlowNetCPUDolphinDB
  hidden_dim: 128
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  max_sequence_length: 40

training:
  epochs: 30
  trajectories_per_epoch: 8
  learning_rate: 0.0002
  weight_decay: 0.0001
  reward_temperature: 1.0
  mixed_precision: false
  max_depth: 5
  max_nodes: 12
  gradient_clip: 1.0
  # DDB流模式由一批表达式共享一次扫描，禁止多线程重复扫描数据库。
  reward_workers: 1
  seed: 42

reward:
  horizon: 5
  top_quantile: 0.10
  risk_aversion: 1.0
  min_cross_section: 20
  min_coverage: 0.80
  coverage_penalty_power: 2.0
  reward_floor: 1.0e-8
  subexpression_cache_enabled: false
  # Reduce后的日频Block很小，可在表达式之间复用，对应研报block cache。
  # 内存LRU只保留少量日频Block；所有Block同时持久化到本地磁盘。
  block_cache_max_entries: 16

pipeline:
  # 不进行粗筛；所有候选均进入完整Reward评估。
  pool_size: 50
  pool_attempts: 600

outputs:
  checkpoint: checkpoints/gflownet_minute_cpu_ddb_best.pt
  metrics: results/minute_cpu_ddb/gflownet_training_metrics.csv
  trajectory_metrics: results/minute_cpu_ddb/gflownet_trajectory_metrics.csv
  alpha_pool: results/minute_cpu_ddb/alpha_pool.csv
  factor_matrix: results/minute_cpu_ddb/alpha_factor_matrix.csv.gz
