dataset:
  file: data/price.csv
  output: data/daily_price.pkl
  horizon: 5
  required_columns: [date, code, open, high, low, close, volume]
  start_date: '2020-01-01'
  end_date: '2026-12-31'
  mining_start_date: '2020-01-01'
  mining_end_date: '2023-12-31'
  out_of_sample_start_date: '2024-01-01'
  out_of_sample_end_date: '2026-12-31'
  chunksize: 500000

model:
  name: GFlowNet
  hidden_dim: 256
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  max_sequence_length: 32

training:
  epochs: 100
  trajectories_per_epoch: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  reward_temperature: 1.0
  mixed_precision: true
  reward_workers: 4
  seed: 42

reward:
  top_quantile: 0.10
  horizon: 5
  risk_aversion: 1.0
  min_cross_section: 20
  min_coverage: 0.80
  coverage_penalty_power: 2.0

alpha_eval:
  rolling_window: 60
  perturbation_std: 0.05
  dpp_k: 50
  dpp_max_rows: 500000
  verbose: true
  seed: 42

lightgbm:
  horizon: 5
  train_window_days: 1008
  min_train_days: 756
  refit_interval_days: 20
  num_leaves: 31
  learning_rate: 0.03
  n_estimators: 500
  seed: 42
  prediction_start_date: '2024-01-01'
  prediction_end_date: '2026-12-31'

backtest:
  initial_cash: 10000000
  benchmark: 000852.XSHG
  top_n: 20
  rebalance_days: 5
  slippage: 0.001
  cash_buffer: 0.98
  rank_smoothing_weights: [0.5, 0.3, 0.2]
  hold_buffer_rank: 100
  max_replacement_ratio: 0.25
  min_holding_days: 10
  # 以下参数直接传入并从RQAlphaPlus解析后的完整config中落盘。
  capital_gain_tax_rate: 0.0
  stock_min_commission: 5.0
  stock_commission_multiplier: 1.0  # RQAlpha股票基准佣金万8，倍率1即实际万8
  tax_multiplier: 1.0
  pit_tax: true                     # 2023-08-28起卖出印花税万5
  volume_percent: 0.25
  portfolio_mode: equal_weight

pipeline:
  # 扩大候选池提高DPP发现低相关因子的机会；最终入模数量仍由alpha_eval.dpp_k控制。
  pool_size: 300
